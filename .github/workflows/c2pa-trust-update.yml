name: Actualizar listas C2PA

on:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Actualizar listas oficiales C2PA
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Descargar las listas del ultimo main de c2pa-org/conformance-public
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/update-c2pa-trust.py main > "$RUNNER_TEMP/summary.md"

      - name: Preparar cuerpo y titulo del PR
        id: prep
        run: |
          if git diff --quiet -- trust/c2pa; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(sed -n 's/^commit = "\(.*\)"$/\1/p' trust/c2pa/SOURCE.lock)
          {
            echo "changed=true"
            echo "short=${sha:0:10}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Actualizacion automatica de las listas oficiales C2PA."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "No se fusiona sola. Revisar el diff de elegibilidad y que los tests pasen (el test del conjunto elegible puede necesitar actualizarse)."
          } > "$RUNNER_TEMP/body.md"

      - name: Abrir PR
        if: steps.prep.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.prep.outputs.short }}
        run: |
          # La rama se nombra por el SHA del upstream: mismo SHA, misma rama.
          branch="chore/c2pa-trust-$SHORT"
          # Rama y PR abiertos: ya esta hecho. Rama sin PR: se reintenta crear
          # el PR (y falla en rojo si no se puede) para no ocultar un SHA atascado.
          branch_exists=false
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            branch_exists=true
            if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
              echo "La rama $branch y su PR abierto ya existen. Nada que hacer."
              exit 0
            fi
            echo "La rama $branch existe sin PR abierto: se crea el PR."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$branch_exists" = false ]; then
            git checkout -b "$branch"
            git add trust/c2pa
            git commit -m "Actualizar listas oficiales C2PA ($SHORT)"
            git push origin "$branch"
          fi
          if ! gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "Actualizar listas oficiales C2PA ($SHORT)" \
            --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::No se pudo crear el PR. Si el error dice que GitHub Actions no puede crear PRs, activa el ajuste del repositorio 'Allow GitHub Actions to create and approve pull requests' (Settings > Actions > General > Workflow permissions). La rama $branch ya se ha subido."
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"
