name: Deploy

# Push to main (or run by hand). The landing image is built here and pushed to
# GHCR; the server only pulls it. Tests stay in ci.yml.
# Secrets (environment "production"): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
# Optional secret: DEPLOY_SSH_PORT (22 when unset). The host key comes from
# ssh-keyscan. GHCR uses GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-delta-sync
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/apps/delta_sync

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: |
          set -euo pipefail
          # GHCR rejects uppercase repository names. GITHUB_REPOSITORY is owner/delta_sync.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          grep -q "image: ${image}:" compose.prod.yaml
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy landing
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://deltasync.simplysoftware.app
    permissions:
      contents: read
      # The server logs in to GHCR with this job's GITHUB_TOKEN to pull the private
      # image; without packages: read the pull answers "denied".
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_KEY DEPLOY_USER DEPLOY_HOST; do
            if [ -z "${!name}" ]; then
              echo "Missing required deploy setting: ${name}." >&2
              exit 1
            fi
          done
          case "${DEPLOY_SSH_PORT}" in
            *[!0-9]*)
              echo "DEPLOY_SSH_PORT must be a port number." >&2
              exit 1
              ;;
          esac
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT}" -H "${DEPLOY_HOST}" > ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Could not collect the server host key." >&2
            exit 1
          fi

      - name: Sync compose file and deploy scripts
        run: |
          set -euo pipefail
          ssh_cmd="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p ${DEPLOY_SSH_PORT}"
          $ssh_cmd "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_PATH}' /opt/apps/edge/sites"
          # Only what the server runs. --delete applies inside deploy/ only.
          rsync -az --delete --relative \
            -e "$ssh_cmd" \
            compose.prod.yaml deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Log in to GHCR on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${DEPLOY_SSH_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"

      - name: Remote deploy
        env:
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${DEPLOY_SSH_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "IMAGE_TAG='${IMAGE_TAG}' bash '${DEPLOY_PATH}/deploy/remote-deploy.sh'"

      # The GITHUB_TOKEN used for the login above expires with this job. Left in
      # the deploy user's ~/.docker/config.json, Docker keeps sending it and any
      # later ghcr.io pull on the VM, public images included, answers "denied"
      # (that broke MyWedding's build of ghcr.io/astral-sh/uv on 2026-10-18).
      - name: Log out of GHCR on the server
        if: always()
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${DEPLOY_SSH_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker logout ghcr.io" || true

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
