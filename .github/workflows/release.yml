name: Release

# Builds the native SDK artifacts for a tag and attaches them to a GitHub Release.
# Tag a release with:  git tag v0.2.0 && git push origin v0.2.0
# workflow_dispatch only builds and uploads workflow artifacts (no Release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  xcframework:
    name: XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build the XCFramework and the Swift bindings
        env:
          INCLUDE_X86_64_SIM: "1"
        run: sdk/swift/scripts/build-xcframework.sh
      - name: Package
        run: scripts/release/package-apple.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: dist/
          if-no-files-found: error

  aar:
    name: Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018
      - name: Build the AAR
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :sdk:assembleRelease --stacktrace --no-daemon
      - name: Collect
        run: |
          mkdir -p dist
          cp sdk/kotlin/build/outputs/aar/sdk-release.aar dist/delta-sync-core-release.aar
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [xcframework, aar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true
      - name: Checksums
        run: scripts/release/checksums.sh staging
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: staging/
          if-no-files-found: error
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          swift_checksum="$(cat staging/DeltaSyncCoreFFI.xcframework.zip.checksum)"
          notes="SwiftPM checksum of DeltaSyncCoreFFI.xcframework.zip: \`${swift_checksum}\`. See docs/RELEASES.md for how to consume these artifacts."
          gh release create "$TAG" staging/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" --verify-tag
