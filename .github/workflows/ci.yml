name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lo dispara c2pa-trust-update.yml en su rama: los PR abiertos con
  # GITHUB_TOKEN no lanzan pull_request y main exige estos checks.
  workflow_dispatch:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Test
        run: cargo test --workspace --locked

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # v3 defaults to `sdkmanager tools`, which Google no longer publishes.
      # v4 skips that package; pin the SDK pieces assembleDebug actually needs.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Assemble debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace --no-daemon
