name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lo dispara c2pa-trust-update.yml en su rama: los PR abiertos con
  # GITHUB_TOKEN no lanzan pull_request y main exige estos checks.
  workflow_dispatch:

jobs:
  # Decide whether the Android build is needed. The Android job is a required
  # check, so it must always report a result: a plain `paths:` filter on the
  # workflow would leave it pending forever. A job skipped through `if:` counts
  # as passing for required checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'sdk/kotlin/**'
              - 'crates/**'
              - 'trust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Test
        run: cargo test --workspace --locked

  android:
    name: Android assembleDebug
    needs: changes
    # Always build on push to main and manual runs; on PRs only when Android
    # inputs changed.
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The app links the Rust core (sdk/kotlin), built for Android with cargo-ndk.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      # v3 defaults to `sdkmanager tools`, which Google no longer publishes.
      # v4 skips that package; pin the SDK pieces assembleDebug actually needs.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018
      - name: Assemble debug, build the AAR, run the JVM tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :sdk:assembleRelease :sdk:testDebugUnitTest --stacktrace --no-daemon
