name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Test
        working-directory: server
        run: cargo test --locked

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Default includes the removed "tools" package, which sdkmanager rejects.
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Assemble debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace --no-daemon
