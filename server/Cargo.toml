[package]
name = "delta-sync-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
publish = false
description = "DeltaSync signing authority and C2PA verification service"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
c2pa = { version = "0.91.2", default-features = false, features = ["rust_native_crypto"] }
ciborium = "0.2"
hex = "0.4"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "=0.13.2", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["std", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
c2pa = { version = "0.91.2", default-features = false, features = ["rust_native_crypto"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
p256 = { version = "0.13", features = ["pem", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "=0.13.2", features = ["x509-parser"] }
tower = { version = "0.5", features = ["util"] }
x509-parser = { version = "0.16", features = ["verify"] }
