# DeltaSync landing behind edge-caddy.
#
# edge-caddy runs with host networking, so it reaches this service on the VM
# loopback. The landing publishes 127.0.0.1:3600 only (not a public port) and
# deploy/caddy/deltasync.simplysoftware.app.caddy proxies to it.

services:
  landing:
    build: .
    image: delta-sync-landing:local
    container_name: delta-sync-landing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3600:3000"
