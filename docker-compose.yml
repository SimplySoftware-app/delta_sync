# Local build of the landing, for trying the production image on a laptop.
# Production does not build: it pulls the image from GHCR with compose.prod.yaml.
#
# This publishes 127.0.0.1:3600 only (not a public port), the same loopback
# port compose.prod.yaml uses behind edge-caddy.

services:
  landing:
    build: .
    image: delta-sync-landing:local
    container_name: delta-sync-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:3600:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
